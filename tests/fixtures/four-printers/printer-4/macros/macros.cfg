[gcode_macro PRINT_START]
gcode:		
    # Parameters
    {% set bed = params.BED|int %}
    {% set hotend = params.EXTRUDER|int %}
    {% set prime_line = params.PRIME_LINE|default(2)|int %}

    # _AUTO_OFF_DISABLE
    # M104 S150
    M140 S{bed}

    # STATUS_HOMING
    _CG28

    # STATUS_HEATING
    M190 S{bed}

    # Move to front right corner to avoid oozing on bed
    Smart_Park
    
    M109 S{hotend}

    # STATUS_PRINTING
    # _RUNOUT_ON

    {% if prime_line == 1 %}
      VORON_PURGE
    {% elif prime_line == 2 %}
      LINE_PURGE
    {% endif %}

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode:
    {% set retract_dist_default = 20 %}
    {% if printer['gcode_macro _KAMP_Settings'] is defined %}
      {% set retract_dist_default = printer["gcode_macro _KAMP_Settings"].tip_distance %}
    {% endif %}
    {% set retract_dist = params.RETRACT|default(retract_dist_default)|int %}
    # _RUNOUT_OFF
    CLEAR_PAUSE

    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-{retract_dist} F3600      ; retract filament
    {% if printer['gcode_macro _KAMP_Settings'] is defined %}
      SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=tip_distance VALUE={retract_dist}
    {% endif %}

    TURN_OFF_HEATERS
