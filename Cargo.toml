[package]
name = "printerkeep"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "Keeps Klipper printer configuration safe in git, and keeps printers in step"
license = "MIT"
repository = "https://github.com/ressu/printerkeep"
readme = "README.md"
keywords = ["klipper", "kalico", "3d-printing", "backup", "git"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1.12.0"
tempfile = "3"
