name: Release

# A tag "v<major>.<minor>.<patch>" (for example v0.2.0) builds and publishes a release. No pre-releases.
# "Run workflow" builds and tests the binaries without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset: printerkeep-linux-aarch64
            run: qemu-aarch64
          - target: armv7-unknown-linux-musleabihf
            asset: printerkeep-linux-armv7
            run: qemu-arm
          - target: arm-unknown-linux-musleabihf
            asset: printerkeep-linux-armv6
            run: qemu-arm -cpu arm1176 # Raspberry Pi Zero W CPU
          - target: x86_64-unknown-linux-musl
            asset: printerkeep-linux-x86_64
            run: ""
    steps:
      - uses: actions/checkout@v7

      # printerkeep install writes "v<version>" to release_info.json, and update_manager compares it with
      # the release title (the tag). They must be the same. Fluidd and Mainsail offer an update only when both
      # are valid semantic versions: three numbers, no pre-release part.
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version in Cargo.toml must be <major>.<minor>.<patch>, not $version." >&2
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG is not v$version (the version in Cargo.toml)." >&2
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Test
        run: cargo test

      - name: Build
        # Links with rust-lld (.cargo/config.toml): no C cross toolchain.
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          cp target/${{ matrix.target }}/release/printerkeep ${{ matrix.asset }}
          ${{ matrix.run }} ./${{ matrix.asset }} --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum printerkeep-linux-* > printerkeep-checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp install.sh dist/
          # update_manager compares the release title with the version in release_info.json (the tag).
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "$TAG" --generate-notes
