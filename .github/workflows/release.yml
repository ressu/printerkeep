name: Release

# A tag "v<major>.<minor>" (for example v0.2) builds and publishes a release. No pre-releases.
# "Run workflow" builds and tests the binaries without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset: printerkeep-linux-aarch64
            run: qemu-aarch64
          - target: armv7-unknown-linux-musleabihf
            asset: printerkeep-linux-armv7
            run: qemu-arm
          - target: arm-unknown-linux-musleabihf
            asset: printerkeep-linux-armv6
            run: qemu-arm -cpu arm1176 # Raspberry Pi Zero W CPU
          - target: x86_64-unknown-linux-musl
            asset: printerkeep-linux-x86_64
            run: ""
    steps:
      - uses: actions/checkout@v7

      # printerkeep install writes "v<version>" to release_info.json, and update_manager compares it with
      # the release title (the tag). They must be the same.
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "$version" in
            *.*.0) ;;
            *) echo "The version in Cargo.toml must be <major>.<minor>.0, not $version." >&2; exit 1 ;;
          esac
          if [ "$TAG" != "v${version%.0}" ]; then
            echo "The tag $TAG is not v${version%.0} (the version in Cargo.toml)." >&2
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # Its latest release (v2.2.1) still targets Node.js 20: GitHub runs it on Node.js 24 with a warning.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0 # same as the Nix devShell

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4 # same as the Nix devShell

      - name: Install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Test
        run: cargo test

      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          cp target/${{ matrix.target }}/release/printerkeep ${{ matrix.asset }}
          ${{ matrix.run }} ./${{ matrix.asset }} --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum printerkeep-linux-* > printerkeep-checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp install.sh dist/
          # update_manager compares the release title with the version in release_info.json (the tag).
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "$TAG" --generate-notes
